<!doctype html>
<!--
  The red-zone channel: every game at once, and one of them large.

  Holds no data of its own. Everything comes from /api/redzone, which is the
  same bytes for every viewer; the only thing this page keeps to itself is
  which game you pinned, because that is yours and must never reach a shared
  cache. The ranking arithmetic lives on the server (fantasyedge/whip.py) so
  that two screens in a room agree on what is worth watching.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Red Zone</title>
<style>
  :root {
    --bg: #07090c;
    --panel: #11151b;
    --line: #1f2731;
    --ink: #eef3f8;
    --dim: #8b97a6;
    --rz: #ff3b30;
    --ball: #ffcc00;
    --live: #34d058;
    --radius: 14px;
    --gap: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font: 15px/1.4 ui-sans-serif, -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: var(--gap);
    max-width: 1700px;
    margin: 0 auto;
  }
  h1 { font-size: 15px; letter-spacing: .14em; text-transform: uppercase; margin: 0; }

  header {
    display: flex; align-items: baseline; gap: 14px;
    flex-wrap: wrap; margin-bottom: var(--gap);
  }
  .counts { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 13px; }
  .counts b { color: var(--ink); font-weight: 600; }
  .rzcount { color: var(--rz); font-weight: 600; }
  .mode {
    margin-left: auto; display: flex; gap: 8px; align-items: center;
  }
  button {
    font: inherit; font-size: 13px; color: var(--ink); cursor: pointer;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 6px 14px;
  }
  /* Scoped to the Auto button on purpose: a pinned tile also carries
     aria-pressed, and an unscoped rule inverted it to white. */
  #auto[aria-pressed="true"] { background: var(--ink); color: #0b0e12; border-color: var(--ink); }
  button:focus-visible { outline: 2px solid var(--live); outline-offset: 2px; }

  /* ── the game on screen ─────────────────────────────────────────────── */
  .focus {
    position: relative; overflow: hidden;
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); padding: 20px; margin-bottom: var(--gap);
    min-height: 150px;
  }
  .focus.rz { border-color: var(--rz); box-shadow: 0 0 0 1px var(--rz) inset; }
  .focus .why {
    font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); display: flex; align-items: center; gap: 8px;
  }
  .focus.rz .why { color: var(--rz); }
  .focus .teams {
    display: flex; align-items: center; gap: 18px; margin-top: 10px;
    flex-wrap: wrap;
  }
  .focus .side { display: flex; align-items: center; gap: 10px; }
  .focus .abbr { font-size: 30px; font-weight: 700; letter-spacing: .02em; }
  .focus .pts {
    font-size: 46px; font-weight: 700; font-variant-numeric: tabular-nums;
    line-height: 1;
  }
  .focus .at { color: var(--dim); font-size: 14px; }
  .focus .clock {
    margin-left: auto; text-align: right; color: var(--dim);
    font-variant-numeric: tabular-nums;
  }
  .focus .sit { font-size: 20px; margin-top: 10px; font-weight: 600; }
  .focus.rz .sit { color: var(--rz); }
  .idle { color: var(--dim); }
  /* A score, announced once the scoreboard carries it. Loud on purpose: the
     whole reason to sit in front of this is not to miss one. */
  .scored {
    display: inline-block; margin-bottom: 8px; padding: 4px 12px;
    background: var(--ball); color: #12160c; border-radius: 6px;
    font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
    font-size: 13px;
  }
  .scoretag { color: var(--ball); }
  .tile.scoring { border-color: var(--ball); }

  /* The ball's distance to the goal line, drawn rather than described. */
  .track { margin-top: 14px; height: 6px; background: #0a0d11;
           border-radius: 99px; overflow: hidden; }
  .track i { display: block; height: 100%; background: var(--rz); }

  /* ── the grid ───────────────────────────────────────────────────────── */
  .grid {
    display: grid; gap: var(--gap);
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
  }
  .tile {
    border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--panel); padding: 12px; cursor: pointer;
    display: flex; flex-direction: column; gap: 8px; text-align: left;
    color: inherit; font: inherit;
  }
  .tile:hover { border-color: #33404f; }
  .tile.rz { border-color: var(--rz); }
  .tile.on { outline: 2px solid var(--ink); outline-offset: -2px; }
  .tile.pinned { outline: 2px solid var(--ball); outline-offset: -2px; }
  .tile.post { opacity: .55; }
  .tile.pre { opacity: .75; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row .abbr { font-weight: 700; letter-spacing: .02em; min-width: 3.4em; }
  .row .pts { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 600; }
  .chip { width: 3px; height: 17px; border-radius: 2px; background: #333; }
  .ball { color: var(--ball); }
  .meta {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--live); }
  .tag {
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--rz); font-weight: 700;
  }
  .sep { margin-left: auto; }
  footer { color: var(--dim); font-size: 12px; margin-top: 16px; }
  .err { color: #ff8a80; }
  @media (prefers-reduced-motion: no-preference) {
    .dot { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 50% { opacity: .35; } }
  }
</style>
</head>
<body>
<header>
  <h1>Red Zone</h1>
  <div class="counts" id="counts"></div>
  <div class="mode">
    <button id="auto" aria-pressed="true">Auto</button>
  </div>
</header>

<section class="focus" id="focus" aria-live="polite"><div class="idle">Loading the slate…</div></section>
<div class="grid" id="grid"></div>
<footer id="foot"></footer>

<script>
"use strict";
// Pinning is the only state this page owns, and it deliberately never leaves
// the browser: /api/redzone must stay identical for every viewer.
let pinned = "";
let auto = true;
let lastTotals = {};

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function sideHtml(side, poss) {
  const ball = side.hasBall ? ' <span class="ball" title="has the ball">●</span>' : "";
  return `<div class="row">
    <i class="chip" style="background:${esc(side.color) || "#333"}"></i>
    <span class="abbr">${esc(side.abbr)}${ball}</span>
    <span class="pts">${Math.round(side.score)}</span>
  </div>`;
}

function tile(g) {
  const cls = ["tile", g.state === "in" ? "live" : g.state];
  if (g.scored) cls.push("scoring");
  else if (g.redZone) cls.push("rz");
  if (g.event === pinned) cls.push("pinned");
  else if (auto && g.focus) cls.push("on");

  const live = g.state === "in";
  const label = g.state === "pre"
    ? new Date(g.kickoff + "Z").toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
    : esc(g.label);

  return `<button class="${cls.join(" ")}" data-event="${esc(g.event)}"
      aria-pressed="${g.event === pinned}">
    ${sideHtml(g.away)}
    ${sideHtml(g.home)}
    <div class="meta">
      ${live ? '<i class="dot"></i>' : ""}
      <span>${label}</span>
      ${g.scored ? `<span class="tag sep scoretag">${esc(g.scored.what)}</span>`
        : g.redZone ? '<span class="tag sep">Red zone</span>'
        : (live && g.situation ? `<span class="sep">${esc(g.situation)}</span>` : "")}
    </div>
  </button>`;
}

function focusHtml(g, why) {
  if (!g) {
    return `<div class="idle">${esc(why)}</div>`;
  }
  // Distance to the goal line, drawn. Absent before the ball is inside the
  // twenty, because a bar that is always full says nothing.
  const ez = g.toEndzone;
  const track = (ez != null && ez <= 20)
    ? `<div class="track"><i style="width:${Math.max(4, 100 - ez * 5)}%"></i></div>` : "";
  const pin = g.event === pinned ? " · pinned" : "";
  // The score is announced only once the scoreboard carries it, which is the
  // stadium's rule: nothing is announced before it has happened.
  const banner = g.scored
    ? `<div class="scored">${esc(g.scored.what)} · ${esc(g.scored.team)}</div>` : "";
  return `${banner}
    <div class="why">${g.state === "in" ? '<i class="dot"></i>' : ""}
      <span>${esc(g.reason)}${pin}</span></div>
    <div class="teams">
      <div class="side"><i class="chip" style="height:30px;background:${esc(g.away.color)}"></i>
        <span class="abbr">${esc(g.away.abbr)}</span><span class="pts">${Math.round(g.away.score)}</span></div>
      <span class="at">at</span>
      <div class="side"><i class="chip" style="height:30px;background:${esc(g.home.color)}"></i>
        <span class="abbr">${esc(g.home.abbr)}</span><span class="pts">${Math.round(g.home.score)}</span></div>
      <div class="clock">${esc(g.label)}</div>
    </div>
    ${g.situation ? `<div class="sit">${esc(g.situation)}</div>` : ""}
    ${track}`;
}

function paint(data) {
  const games = data.games || [];
  const shown = pinned || data.focus;
  for (const g of games) g.focus = g.event === data.focus;

  const on = games.find((g) => g.event === shown);
  const focusEl = $("focus");
  focusEl.className = "focus" + (on && on.redZone ? " rz" : "");
  focusEl.innerHTML = focusHtml(
    on, data.counts.live ? "Choosing a game…" : "No game in progress yet.");

  // Grid order: live first (most urgent first), then upcoming by kickoff,
  // then finals. A finished game sinking to the bottom is the whole point of
  // a channel - it is not what you are here for.
  const rank = (g) => (g.state === "in" ? 0 : g.state === "pre" ? 1 : 2);
  const ordered = games.slice().sort((a, b) =>
    rank(a) - rank(b) ||
    (rank(a) === 0 ? b.urgency - a.urgency : (a.kickoff || "").localeCompare(b.kickoff || "")));
  $("grid").innerHTML = ordered.map(tile).join("");

  const c = data.counts || {};
  $("counts").innerHTML =
    `<b>${c.live || 0}</b> live · <b>${c.final || 0}</b> final · ` +
    `<b>${(c.total || 0) - (c.live || 0) - (c.final || 0)}</b> to come` +
    (c.redZone ? ` · <span class="rzcount">${c.redZone} in the red zone</span>` : "");

  const when = new Date().toLocaleTimeString();
  $("foot").innerHTML = data.error
    ? `<span class="err">${esc(data.error)}</span> · last good frame ${when}`
    : `${esc((data.league || "").toUpperCase())} · updated ${when} · ` +
      `click a game to pin it, Auto to let it follow the ball`;
}

async function tick() {
  try {
    const r = await fetch("/api/redzone", { cache: "no-store" });
    if (r.ok) paint(await r.json());
  } catch (e) {
    $("foot").innerHTML = `<span class="err">${esc(e.message)}</span> — retrying`;
  }
}

$("grid").addEventListener("click", (e) => {
  const el = e.target.closest("[data-event]");
  if (!el) return;
  const id = el.dataset.event;
  pinned = pinned === id ? "" : id;       // clicking the pinned game releases it
  auto = !pinned;
  $("auto").setAttribute("aria-pressed", String(auto));
  tick();
});

$("auto").addEventListener("click", () => {
  pinned = "";
  auto = true;
  $("auto").setAttribute("aria-pressed", "true");
  tick();
});

// Three seconds is the page's own rhythm; the server holds ESPN to its own
// slower clock behind a cache, so polling faster here costs the feed nothing
// and a pinned red-zone snap still updates while you watch it.
tick();
setInterval(tick, 3000);
</script>
</body>
</html>
